name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api — verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Includes Testcontainers (Docker is available on ubuntu runners) and the OpenAPI contract test.
      - run: ./mvnw -B -pl api verify

  web:
    name: web — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Generated API client is up to date with api/openapi.json
        run: |
          npm --prefix web run gen:api
          git diff --exit-code -- web/src/api/schema.gen.ts
      - run: npm --prefix web run typecheck
      # Browser anonymizer: byte-identical to tools/Anonymize.java on the shared golden files (Node test runner).
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npm --prefix web run build:demo

  compose:
    name: docker compose — full stack smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build
      - name: SPA serves and proxies /api/health to the API
        run: |
          # No pipe in the condition: the step shell has no pipefail, so `curl | tee` would always succeed.
          for i in $(seq 1 60); do
            if curl -fsS -o /tmp/health.json http://localhost:3000/api/health; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"database":"UP"' /tmp/health.json
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
